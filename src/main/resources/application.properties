spring.application.name=boutique-en-ligne

# Identifiant de requete MDC dans les logs console et fichier.
logging.pattern.level=%5p [correlationId=%X{correlationId}]

# Base H2 en mémoire (console : http://localhost:8080/h2-console, JDBC URL ci-dessous)
spring.datasource.url=jdbc:h2:mem:boutique;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Chargement de data.sql après la création du schéma par Hibernate
spring.jpa.defer-datasource-initialization=true

# --- Sécurité JWT ---
# En production, fournir la clé via la variable d'environnement JWT_SECRET (>= 32 caractères).
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
app.jwt.expiration=PT1H
app.jwt.issuer=boutique-en-ligne

# Comptes de démonstration (alice, bob, admin) - désactiver en production
app.demo-data.enabled=true